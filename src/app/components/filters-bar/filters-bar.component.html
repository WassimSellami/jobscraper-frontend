<div class="filters-bar">
    <form [formGroup]="form" class="filters-container">

        <!-- Search Terms Row -->
        <div class="filters-row-search">
            <div class="filter-group">
                <div class="label-with-buttons">
                    <label>Search Terms</label>
                    <div class="label-buttons">
                        <button type="button" class="label-btn" (click)="selectAllSearchTerms()"
                            title="Select all">Select All</button>
                        <button type="button" class="label-btn" (click)="deselectAllSearchTerms()"
                            title="Deselect all">Deselect All</button>
                    </div>
                </div>
                <div class="chips-wrapper">
                    <div class="chips">
                        <button *ngFor="let term of searchTerms; let i = index" type="button"
                            class="chip chip-selectable" [class.chip-selected]="isSearchTermSelected(term)"
                            (click)="toggleSearchTerm(term)">
                            <span class="chip-text">{{ term }}</span>
                            <span class="chip-remove" (click)="removeSearchTerm(i); $event.stopPropagation()">✕</span>
                        </button>

                        <ng-container *ngIf="!showSearchTermsAddInput">
                            <button type="button" class="chip-add" (click)="onSearchTermAddClick()">+</button>
                        </ng-container>

                        <ng-container *ngIf="showSearchTermsAddInput">
                            <input [(ngModel)]="searchTermsInput" [ngModelOptions]="{standalone: true}"
                                (keydown)="onSearchTermKeydown($event)" type="text" placeholder="Add term, press Enter"
                                class="chip-input chip-input-inline search-term-add-input"
                                (blur)="cancelSearchTermAdd()" />
                        </ng-container>
                    </div>
                </div>
                <!-- Error message -->
                <span class="error-message" *ngIf="showSearchTermsError">
                    ⚠ Please select at least one search term.
                </span>
            </div>
        </div>

        <!-- Sites Row -->
        <div class="filters-row-sites">
            <div class="filter-group">
                <div class="label-with-buttons">
                    <label>Sites</label>
                    <div class="label-buttons">
                        <button type="button" class="label-btn" (click)="selectAllSites()" title="Select all">Select
                            All</button>
                        <button type="button" class="label-btn" (click)="deselectAllSites()"
                            title="Deselect all">Deselect All</button>
                    </div>
                </div>
                <div class="chips-wrapper">
                    <div class="chips">
                        <button *ngFor="let site of AVAILABLE_SITES" type="button" class="chip chip-selectable"
                            [class.chip-selected]="isSiteSelected(site)" (click)="toggleSite(site)">
                            <span class="chip-text">{{ site }}</span>
                        </button>
                    </div>
                </div>
                <span class="error-message" *ngIf="showSitesError">
                    ⚠ Please select at least one site.
                </span>
            </div>
        </div>

        <!-- Job Level Row -->
        <div class="filters-row-job-level">
            <div class="filter-group">
                <div class="label-with-buttons">
                    <label>Job Level</label>
                    <div class="label-buttons">
                        <button type="button" class="label-btn" (click)="selectAllJobLevels()" title="Select all">Select
                            All</button>
                        <button type="button" class="label-btn" (click)="deselectAllJobLevels()"
                            title="Deselect all">Deselect All</button>
                    </div>
                </div>
                <div class="chips-wrapper">
                    <div class="chips">
                        <!-- Now purely toggle chips, no add/remove -->
                        <button *ngFor="let level of ALLOWED_JOB_LEVELS" type="button" class="chip chip-selectable"
                            [class.chip-selected]="isJobLevelSelected(level)" (click)="toggleJobLevel(level)">
                            <span class="chip-text">{{ level }}</span>
                        </button>
                    </div>
                </div>
                <!-- Error message -->
                <span class="error-message" *ngIf="showJobLevelsError">
                    ⚠ Please select at least one job level.
                </span>
            </div>
        </div>

        <!-- Company Exclusions Row -->
        <div class="filters-row-exclusions">
            <div class="filter-group">
                <div class="label-with-buttons">
                    <label>Exclude Companies</label>
                    <div class="label-buttons">
                        <button type="button" class="label-btn toggle-list-btn"
                            (click)="toggleCompanyExclusionsVisibility()"
                            [attr.aria-label]="showCompanyExclusions ? 'Collapse company exclusions' : 'Expand company exclusions'"
                            [attr.aria-expanded]="showCompanyExclusions">
                            <span class="arrow" [class.expanded]="showCompanyExclusions">▾</span>
                        </button>
                        <button type="button" class="label-btn" (click)="selectAllCompanyExclusions()"
                            title="Select all">Select All</button>
                        <button type="button" class="label-btn" (click)="deselectAllCompanyExclusions()"
                            title="Deselect all">Deselect All</button>
                    </div>
                </div>
                <div class="chips-wrapper" *ngIf="showCompanyExclusions">
                    <div class="chips">
                        <button *ngFor="let term of companyExclusionTerms; let i = index" type="button"
                            class="chip chip-selectable" [class.chip-selected]="isCompanyExclusionSelected(term)"
                            (click)="toggleCompanyExclusion(term)">
                            <span class="chip-text">{{ term }}</span>
                            <span class="chip-remove"
                                (click)="removeCompanyExclusion(i); $event.stopPropagation()">✕</span>
                        </button>

                        <ng-container *ngIf="!showCompanyExclusionAddInput">
                            <button type="button" class="chip-add" (click)="onCompanyExclusionAddClick()">+</button>
                        </ng-container>

                        <ng-container *ngIf="showCompanyExclusionAddInput">
                            <input [(ngModel)]="companyExclusionInput" [ngModelOptions]="{standalone: true}"
                                (keydown)="onCompanyExclusionKeydown($event)" type="text"
                                placeholder="Add term, press Enter"
                                class="chip-input chip-input-inline company-exclusion-add-input"
                                (blur)="cancelCompanyExclusionAdd()" />
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>

        <!-- Position Exclusions Row -->
        <div class="filters-row-exclusions">
            <div class="filter-group">
                <div class="label-with-buttons">
                    <label>Exclude Positions</label>
                    <div class="label-buttons">
                        <button type="button" class="label-btn toggle-list-btn"
                            (click)="togglePositionExclusionsVisibility()"
                            [attr.aria-label]="showPositionExclusions ? 'Collapse position exclusions' : 'Expand position exclusions'"
                            [attr.aria-expanded]="showPositionExclusions">
                            <span class="arrow" [class.expanded]="showPositionExclusions">▾</span>
                        </button>
                        <button type="button" class="label-btn" (click)="selectAllPositionExclusions()"
                            title="Select all">Select All</button>
                        <button type="button" class="label-btn" (click)="deselectAllPositionExclusions()"
                            title="Deselect all">Deselect All</button>
                    </div>
                </div>
                <div class="chips-wrapper" *ngIf="showPositionExclusions">
                    <div class="chips">
                        <button *ngFor="let term of positionExclusionTerms; let i = index" type="button"
                            class="chip chip-selectable" [class.chip-selected]="isPositionExclusionSelected(term)"
                            (click)="togglePositionExclusion(term)">
                            <span class="chip-text">{{ term }}</span>
                            <span class="chip-remove"
                                (click)="removePositionExclusion(i); $event.stopPropagation()">✕</span>
                        </button>

                        <ng-container *ngIf="!showPositionExclusionAddInput">
                            <button type="button" class="chip-add" (click)="onPositionExclusionAddClick()">+</button>
                        </ng-container>

                        <ng-container *ngIf="showPositionExclusionAddInput">
                            <input [(ngModel)]="positionExclusionInput" [ngModelOptions]="{standalone: true}"
                                (keydown)="onPositionExclusionKeydown($event)" type="text"
                                placeholder="Add term, press Enter"
                                class="chip-input chip-input-inline position-exclusion-add-input"
                                (blur)="cancelPositionExclusionAdd()" />
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Row: Location and Other Filters -->
        <div class="filters-row-bottom">
            <div class="filter-group">
                <label for="location">Location</label>
                <div class="location-autocomplete">
                    <input id="location" formControlName="LOCATION" type="text" class="text-input"
                        placeholder="Search a city in Germany" autocomplete="off" (focus)="onLocationFocus()"
                        (blur)="onLocationBlur()" (keydown)="onLocationKeydown($event)" />

                    <div class="location-suggestions" *ngIf="locationSuggestionsVisible">
                        <button type="button" class="location-suggestion"
                            *ngFor="let suggestion of locationSuggestions; let i = index"
                            [class.highlighted]="i === highlightedLocationIndex"
                            (mouseenter)="highlightedLocationIndex = i"
                            (mousedown)="selectLocationSuggestion(suggestion); $event.preventDefault()">
                            <span class="location-suggestion-city">{{ suggestion.city }}</span>
                            <span class="location-suggestion-country">Germany</span>
                        </button>

                        <div class="location-suggestion location-suggestion-status" *ngIf="locationSearchLoading">
                            Searching German cities...
                        </div>

                        <div class="location-suggestion location-suggestion-status"
                            *ngIf="!locationSearchLoading && locationSuggestions.length === 0 && (form.get('LOCATION')?.value?.trim()?.length ?? 0) >= 3">
                            No German cities found.
                        </div>
                        <div class="error-message" *ngIf="showLocationError">
                            ⚠ Please select a city from the list.
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <label for="distance">Distance (miles)</label>
                <input id="distance" formControlName="DISTANCE_MILES" type="number" class="number-input" />
            </div>

            <div class="filter-group">
                <label for="hours">Hours Old</label>
                <input id="hours" formControlName="HOURS_OLD" type="number" class="number-input" />
            </div>

            <div class="filter-group">
                <label for="results">Results per search term</label>
                <input id="results" formControlName="RESULTS_WANTED" type="number" class="number-input" />
            </div>

            <div class="filter-group deutsch-group">
                <label>Allow Deutsch</label>
                <button type="button" class="toggle-deutsch" [class.toggle-enabled]="isAllowDeutschEnabled()"
                    [class.toggle-disabled]="!isAllowDeutschEnabled()" (click)="toggleAllowDeutsch()">
                    <span class="toggle-circle"></span>
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button type="button" class="btn btn-primary" (click)="onScrape()" [disabled]="isLoading">
                <span *ngIf="!isLoading">Scrape</span>
                <span *ngIf="isLoading" class="spinner">⏳</span>
            </button>
            <button type="button" class="btn btn-secondary" (click)="exportCSV()"
                [disabled]="!jobs || jobs.length === 0">
                Export CSV
            </button>
        </div>

    </form>
</div>
