<div class="filters-bar">
    <form [formGroup]="form" class="filters-container">

        <!-- Search Terms Row -->
        <div class="filters-row-search">
            <div class="filter-group">
                <label>Search Terms</label>
                <div class="chips-wrapper">
                    <div class="chips">
                        <button *ngFor="let term of searchTerms; let i = index" type="button"
                            class="chip chip-selectable" [class.chip-selected]="isSearchTermSelected(term)"
                            (click)="toggleSearchTerm(term)">
                            <span class="chip-text">{{ term }}</span>
                            <span class="chip-remove" (click)="removeSearchTerm(i); $event.stopPropagation()">✕</span>
                        </button>

                        <ng-container *ngIf="!showSearchTermsAddInput">
                            <button type="button" class="chip-add" (click)="onSearchTermAddClick()">+</button>
                        </ng-container>

                        <ng-container *ngIf="showSearchTermsAddInput">
                            <input [(ngModel)]="searchTermsInput" [ngModelOptions]="{standalone: true}"
                                (keydown)="onSearchTermKeydown($event)" type="text" placeholder="Add term, press Enter"
                                class="chip-input chip-input-inline search-term-add-input"
                                (blur)="cancelSearchTermAdd()" />
                        </ng-container>
                    </div>
                </div>
                <!-- Error message -->
                <span class="error-message" *ngIf="showSearchTermsError">
                    ⚠ Please select at least one search term.
                </span>
            </div>
        </div>

        <!-- Job Level Row -->
        <div class="filters-row-job-level">
            <div class="filter-group">
                <label>Job Level</label>
                <div class="chips-wrapper">
                    <div class="chips">
                        <!-- Now purely toggle chips, no add/remove -->
                        <button *ngFor="let level of ALLOWED_JOB_LEVELS" type="button" class="chip chip-selectable"
                            [class.chip-selected]="isJobLevelSelected(level)" (click)="toggleJobLevel(level)">
                            <span class="chip-text">{{ level }}</span>
                        </button>
                    </div>
                </div>
                <!-- Error message -->
                <span class="error-message" *ngIf="showJobLevelsError">
                    ⚠ Please select at least one job level.
                </span>
            </div>
        </div>

        <!-- Bottom Row: Location and Other Filters -->
        <div class="filters-row-bottom">
            <div class="filter-group">
                <label for="location">Location</label>
                <input id="location" formControlName="LOCATION" type="text" class="text-input" />
            </div>

            <div class="filter-group">
                <label for="distance">Distance (miles)</label>
                <input id="distance" formControlName="DISTANCE_MILES" type="number" class="number-input" />
            </div>

            <div class="filter-group">
                <label for="hours">Hours Old</label>
                <input id="hours" formControlName="HOURS_OLD" type="number" class="number-input" />
            </div>

            <div class="filter-group">
                <label for="results">Results per search term</label>
                <input id="results" formControlName="RESULTS_WANTED" type="number" class="number-input" />
            </div>

            <div class="filter-group deutsch-group">
                <label>Allow Deutsch</label>
                <button type="button" class="toggle-deutsch" [class.toggle-enabled]="isAllowDeutschEnabled()"
                    [class.toggle-disabled]="!isAllowDeutschEnabled()" (click)="toggleAllowDeutsch()">
                    <span class="toggle-circle"></span>
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button type="button" class="btn btn-primary" (click)="onScrape()" [disabled]="isLoading">
                <span *ngIf="!isLoading">Scrape</span>
                <span *ngIf="isLoading" class="spinner">⏳</span>
            </button>
            <button type="button" class="btn btn-secondary" (click)="exportCSV()"
                [disabled]="!jobs || jobs.length === 0">
                Export CSV
            </button>
        </div>

    </form>
</div>
